name: Deploy
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: executing remote ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            export NODE_PATH=/home/ubuntu/.nvm/versions/node/v22.15.0/bin
            export PATH=$NODE_PATH:$PATH
            
            cd /home/ubuntu/web/fermi
            git pull origin master
            npm install
            npm run build
            PORT=3002 pm2 restart fermi-gateway --update-env

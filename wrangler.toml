name = "fermi-notes"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 database binding — necessario per @nuxt/content v3
# Crea il database con: npx wrangler d1 create fermi-content
[[d1_databases]]
binding = "DB"
database_name = "fermi-content"
database_id = "INSERISCI-QUI-IL-DATABASE-ID"
